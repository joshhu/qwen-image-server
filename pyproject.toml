[project]
name = "qwen-image-server"
version = "0.1.0"
description = "OpenAI-compatible image generation API for Qwen-Image-2.1 on AMD ROCm (Strix Halo / gfx1151)"
readme = "README.md"
authors = [
    { name = "Josh Hu", email = "josh.hu@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "pydantic>=2",
]

[project.scripts]
qwen-image-server = "qwen_image_server.server:main"

[project.optional-dependencies]
# torch 由 rocm/pytorch base image 提供，這裡不裝，避免蓋掉 ROCm 版本
gpu = [
    "diffusers @ git+https://github.com/huggingface/diffusers",
    "transformers>=5.17",
    "accelerate",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: hits a real running server (set E2E_URL)"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
